manifestVersion: 1
id: media-tools-tdarr
name: Tdarr
tagline: Automatische video- en audioconversie voor je mediabibliotheek
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/tdarr.png
category: Media
version: "2.0.0"
