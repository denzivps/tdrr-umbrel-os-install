description: >-
  Tdarr analyseert en verwerkt je video- en audiobibliotheek automatisch met
  FFmpeg en HandBrake. Stel regels in om bestanden te remuxen, te converteren
  of te optimaliseren, en gebruik de ingebouwde worker om direct te beginnen.


  Plaats media die Tdarr mag verwerken in de map media van deze app. Let op:
  een transcode kan bronbestanden vervangen; test je workflow daarom eerst met
  een kopie van je bestanden.
developer: HaveAGitGat
